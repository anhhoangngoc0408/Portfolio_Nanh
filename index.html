async function ghPut(file,content,msg){
 const c=GH.cfg;let sha;
 const g=await ghq(`contents/${file}?ref=${encodeURIComponent(c.branch)}`);
 if(g.ok)sha=(await g.json()).sha;else if(g.status!==404)throw{code:g.status};
 const r=await ghq(`contents/${file}`,{method:'PUT',body:JSON.stringify({message:msg,content,branch:c.branch,sha})});
 if(!r.ok)throw{code:r.status===409||r.status===422?'conflict':r.status};
 return r.json()
}
async function enableAdmin(){
 canEdit=true;
 api={publish:t=>ghPut('data.json',b64t(t),'Update content (admin)')};
 assets={upload:async f=>{
  const ext=((f.type||'image/jpeg').split('/')[1]||'jpg').replace('jpeg','jpg').replace('svg+xml','svg').replace(/[^a-z0-9]/gi,'');
  const name=`images/${Date.now().toString(36)}${Math.random().toString(36).slice(2,6)}.${ext}`;
  await ghPut(name,await b64f(f),'Upload '+name);PEND[name]=URL.createObjectURL(f);return{url:name}}};
 try{const r=await ghq(`contents/data.json?ref=${encodeURIComponent(GH.cfg.branch)}`,{headers:{Accept:'application/vnd.github.raw+json'}});
  if(r.ok){const d=await r.json();if(d&&d.profile&&Array.isArray(d.sections)){S.profile=d.profile;S.sections=d.sections;orig=JSON.stringify(d)}}}catch(e){}
 render()
}
function ghLogin(){
 const h=location.hostname,g=h.endsWith('.github.io')?{o:h.split('.')[0],r:location.pathname.split('/')[1]||h}:{o:'',r:''},c=GH.cfg||{};
 show(`<h3>Đăng nhập admin</h3><label>GitHub username</label><input id="gho" value="${esc(c.owner||g.o)}"><label>Tên repo</label><input id="ghr" value="${esc(c.repo||g.r)}"><label>Fine-grained token (github_pat_…)</label><input id="ght" type="password" autocomplete="off"><small>Token chỉ lưu trong trình duyệt này. Chỉ cần quyền Contents: Read and write cho đúng repo này.</small><div class="row"><button class="btn g sm" id="x">Đóng</button><button class="btn p sm" id="ok">Đăng nhập</button></div>`);
 $('#x',dlg).onclick=()=>dlg.close();
 $('#ok',dlg).onclick=async()=>{
  const cfg={owner:$('#gho',dlg).value.trim(),repo:$('#ghr',dlg).value.trim(),token:$('#ght',dlg).value.trim()};
  if(!cfg.owner||!cfg.repo||!cfg.token)return toast('Điền đủ 3 ô nhé');
  try{const r=await ghq('',{},cfg);if(!r.ok)return toast(r.status===404?'Lỗi 404: không thấy repo. Kiểm tra tên repo, và token đã được chọn đúng repo này chưa':r.status===401?'Lỗi 401: token sai hoặc đã hết hạn (hãy copy lại cả chuỗi github_pat_…)':'Lỗi '+r.status+' từ GitHub');
   const j=await r.json();if(!(j.permissions&&j.permissions.push))return toast('Token chỉ có quyền đọc. Sửa Contents thành Read and write');
   cfg.branch=j.default_branch;localStorage.setItem('gh_cfg',JSON.stringify(cfg));dlg.close();history.replaceState(null,'',location.pathname+location.search);await enableAdmin();toast('Đã đăng nhập admin')
  }catch(e){toast('Không kết nối được GitHub: '+(e&&e.message||e))}}
}
(async()=>{
 try{const r=await fetch('data.json',{cache:'no-cache'});if(r.ok){const d=await r.json();if(d&&d.profile&&Array.isArray(d.sections)){S.profile=d.profile;S.sections=d.sections;orig=JSON.stringify(d)}}}catch(e){}
 render();
 if(GH.cfg)enableAdmin();else if(location.hash==='#admin')ghLogin();
 addEventListener('hashchange',()=>{if(location.hash==='#admin'&&!GH.cfg)ghLogin()});
})();
</script>
